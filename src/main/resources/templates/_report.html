<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="report">
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>ID number</th>
                <th>Employee name</th>
                <th>Country</th>
                <th>On call start hour</th>
                <th>On call end hour</th>
            </tr>
        </thead>
        <tbody id="content-to-copy">
            <tr th:each="i : ${report.items}">
                <td th:text="${#temporals.format(i.date, 'EEEE, MMM d, yyyy', T(java.util.Locale).ENGLISH)}">13/01/2011</td>
                <td th:text="${report.number}">777</td>
                <td th:text="${report.name}">John Doe</td>
                <td th:text="${report.country.value}">Czechia</td>
                <td th:text="${i.start}">9:00</td>
                <td th:text="${#temporals.format(i.end, 'kk:mm')}">24:00</td>
            </tr>
        </tbody>
    </table>
    <div th:if="${not #lists.isEmpty(report.incidents)}">
        <h3>Incidents</h3>
        <table>
            <thead>
                <tr>
                    <th>Number</th>
                    <th>Title</th>
                    <th>Opened</th>
                    <th>Closed</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="inc : ${report.incidents}">
                    <td th:text="${inc.number}">123</td>
                    <td th:text="${inc.title}">Incident</td>
                    <td th:text="${#temporals.format(inc.opened, 'EEEE, MMM d, yyyy HH:mm', T(java.util.Locale).ENGLISH)}">Monday, Jan 13, 2025 09:00</td>
                    <td th:text="${inc.closed != null ? #temporals.format(inc.closed, 'EEEE, MMM d, yyyy HH:mm', T(java.util.Locale).ENGLISH) : ''}">Monday, Jan 13, 2025 17:00</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
