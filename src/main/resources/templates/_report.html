<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="report">
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>ID number</th>
                <th>Employee name</th>
                <th>Country</th>
                <th>On call start hour</th>
                <th>On call end hour</th>
            </tr>
        </thead>
        <tbody id="content-to-copy">
            <tr th:each="i : ${report.items}">
                <td th:text="${#temporals.format(i.date, 'EEEE, MMM d, yyyy', T(java.util.Locale).ENGLISH)}">13/01/2011</td>
                <td th:text="${report.number}">777</td>
                <td th:text="${report.name}">John Doe</td>
                <td th:text="${report.country.value}">Czechia</td>
                <td th:text="${i.start}">9:00</td>
                <td th:text="${#temporals.format(i.end, 'kk:mm')}">24:00</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
