name: build

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: 'write'
      id-token: 'write'

    steps:
      - name: Checkout Git
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_KEY }}

      # Exposes GitHub secrets (except GCLOUD_SERVICE_KEY, used only for auth above) as env
      # vars, so adding a new secret needs no workflow change. The deploy fails fast if
      # app.yaml references one that is unset.
      - name: Export secrets to environment
        run: |
          echo '${{ toJSON(secrets) }}' | jq -r 'to_entries[] | select(.key != "GCLOUD_SERVICE_KEY") | "\(.key)<<__SECRET_EOF__\n\(.value)\n__SECRET_EOF__"' >> "$GITHUB_ENV"

      - name: Build and Deploy
        run: ./mvnw -B deploy

      - name: Publish Tests Report
        uses: martiner/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: 'target/*-reports/TEST-*.xml'

      - name: Generate release tag name
        id: tag
        run: |
          echo "tag=deploy/$(TZ=Europe/Prague date +%Y-%m-%dT%H-%M-%S%z)" >> $GITHUB_OUTPUT

      - name: Create release
        id: create_release
        uses: martiner/release-action@v1.14.0
        with:
          tag: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
